[package]
name = "redoxer"
version = "0.2.63"
description = "Method for quickly running programs inside of Redox from a KVM capable OS."
license = "MIT"
authors = ["Jeremy Soller <jackpot51@gmail.com>"]
repository = "https://gitlab.redox-os.org/redox-os/redoxer"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "6.0"
sha2 = "0.10"
proc-mounts = { version = "0.3", optional = true }
redox_installer = { version = "0.2.42", optional = true }
redox-pkg = { version = "0.3.1", features = ["indicatif"], optional = true }
redox_syscall = { version = "0.7", optional = true }
redoxfs = { version = "0.9", optional = true }
tempfile = { version = "3.20", optional = true }
toml = { version = "0.8", optional = true }

[features]
default = ["cli-pkg", "cli-exec"]
cli-pkg = ["redox-pkg"]
cli-exec = [
    "redox_installer",
    "redox_syscall",
    "redoxfs",
    "tempfile",
    "proc-mounts",
    "toml",
]

# retezec/rtzc#3243: static.redox-os.org refuses a request without a
# User-Agent; redox-pkg's reqwest client sends none. The fork's one commit
# names the crate (retezec/pkgutils rtzc-user-agent, on 52f7930f = 0.3.1).
[patch.crates-io]
redox-pkg = { git = "https://github.com/retezec/pkgutils", rev = "b563f2f80a8a2e3fa2661ccfbbdb7c2eced8a833" }
